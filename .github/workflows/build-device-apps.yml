name: Build device apps
on:
  push:
    paths: ['apps/**', 'scripts/package-roku.py', '.github/workflows/build-device-apps.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle -p apps/android assembleDebug
      - run: mkdir -p packages && cp apps/android/app/build/outputs/apk/debug/app-debug.apk packages/africa-media-android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-phone-tablet-tv-fire-development
          path: packages/*.apk
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: apps/desktop
      - run: npm run dist -- --publish never
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-unsigned
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage
  apple-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: apps/apple
      - run: xcodebuild -project AfricaMediaHub.xcodeproj -scheme AfricaMediaHub -sdk iphonesimulator -configuration Debug -derivedDataPath build-ios CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/apple
      - run: xcodebuild -project AfricaMediaHub.xcodeproj -scheme AfricaMediaTV -sdk appletvsimulator -configuration Debug -derivedDataPath build-tv CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/apple

  roku:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/package-roku.py
      - uses: actions/upload-artifact@v4
        with:
          name: roku-development-channel
          path: packages/africa-media-roku.zip
  lg-webos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @webos-tools/cli
      - run: |
          mkdir -p packages webos-stage
          cp apps/tv-web/index.html apps/tv-web/launch.js apps/tv-web/icon.png apps/tv-web/appinfo.json webos-stage/
          ares-package webos-stage --outdir packages --no-minify
          mv packages/com.africamedia.hub_*.ipk packages/africa-media-lg.ipk
      - uses: actions/upload-artifact@v4
        with:
          name: lg-webos-development
          path: packages/africa-media-lg.ipk
