---
- name: Prepare protected application repair
  hosts: all
  become: true
  tasks:
    - name: Ensure repair prerequisites
      ansible.builtin.apt:
        name: [git, python3, python3-venv, nginx, certbot, python3-certbot-nginx]
        state: present
        update_cache: true
    - name: Create protected repair backup directory
      ansible.builtin.file:
        path: /var/backups/africa-media/repair
        state: directory
        owner: root
        group: root
        mode: '0700'
    - name: Check dedicated site
      ansible.builtin.stat:
        path: /etc/nginx/sites-available/africa-media.conf
      register: repair_site
    - name: Preserve existing dedicated Nginx configuration
      ansible.builtin.copy:
        src: /etc/nginx/sites-available/africa-media.conf
        dest: '/var/backups/africa-media/repair/nginx-{{ ansible_date_time.epoch }}.conf'
        remote_src: true
        mode: '0600'
      when: repair_site.stat.exists
    - name: Check existing certificate
      ansible.builtin.stat:
        path: /etc/letsencrypt/live/media.africandroid.world/fullchain.pem
      register: repair_cert
    - name: Rebuild dedicated HTTPS site using existing certificate
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/africa-media.conf
        mode: '0644'
        content: |
          server {
            listen 80;
            server_name media.africandroid.world;
            return 301 https://$host$request_uri;
          }
          server {
            listen 443 ssl;
            server_name media.africandroid.world;
            ssl_certificate /etc/letsencrypt/live/media.africandroid.world/fullchain.pem;
            ssl_certificate_key /etc/letsencrypt/live/media.africandroid.world/privkey.pem;
            client_max_body_size 100k;
            location / {
              proxy_pass http://127.0.0.1:18841;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_read_timeout 60s;
            }
          }
      when: repair_cert.stat.exists
    - name: Check application data directory
      ansible.builtin.stat:
        path: /var/lib/africa-media
      register: repair_data
    - name: Repair data ownership for service writes
      ansible.builtin.file:
        path: /var/lib/africa-media
        owner: africa-media
        group: africa-media
        recurse: true
      when: repair_data.stat.exists

- name: Back up database, pull code, rebuild dependencies and restart
  ansible.builtin.import_playbook: deploy-support.yml
  vars:
    media_refresh_channels: false
    media_prune_channels: false

- name: Verify repair and frontend delivery
  hosts: all
  become: true
  tasks:
    - name: Check database integrity as service user
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - "import sqlite3; c=sqlite3.connect('file:/var/lib/africa-media/media.db?mode=ro',uri=True); result=c.execute('PRAGMA integrity_check').fetchone()[0]; print(result); raise SystemExit(0 if result=='ok' else 1)"
      become_user: africa-media
      changed_when: false
    - name: Validate all application Python modules
      ansible.builtin.command:
        argv: [/usr/bin/python3, -c, "import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('/opt/africa-media').glob('*.py')]; print('Python modules valid')"]
      changed_when: false
    - name: Check frontend assets and recovery page
      ansible.builtin.uri:
        url: 'http://127.0.0.1:18841/{{ item }}'
        return_content: true
      loop: [style.css, tv-ui.css, app.js, channel-guide.js, languages.js, advertising.js, support.js, activity.js, sw.js, offline.html, offline.css, reconnect.js]
      register: repair_assets
      failed_when: repair_assets.status != 200 or repair_assets.content | length == 0
    - name: Validate and restart gateway
      ansible.builtin.command: nginx -t
      changed_when: false
    - name: Ensure Nginx is running
      ansible.builtin.systemd:
        name: nginx
        state: restarted
        enabled: true
    - name: Verify public HTTPS and certificate validation
      ansible.builtin.uri:
        url: https://media.africandroid.world/api/health
        return_content: true
        validate_certs: true
      register: repair_public
      retries: 5
      delay: 3
      until: repair_public.status == 200 and repair_public.json.service | default('') == 'Africa Media Hub'
    - name: Report recovery
      ansible.builtin.debug:
        msg:
          - 'Application, database, frontend assets and public HTTPS checks passed.'
          - 'Open https://media.africandroid.world/?reconnect=1 and reload once to update the offline cache.'
          - 'Channels and payment/support credentials were preserved. Channel scans were skipped.'
