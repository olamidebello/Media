---
- name: Update the existing Media server
  ansible.builtin.import_playbook: deploy-tv-install.yml

- name: Migrate and restore channel artwork
  hosts: all
  become: true
  vars:
    media_root: /opt/africa-media
    media_port: 18841
  tasks:
    - name: Add artwork columns and restore bundled playlist logos
      become_user: africa-media
      ansible.builtin.command:
        argv: [python3, '{{ media_root }}/tools/backfill_artwork.py']
      environment:
        MEDIA_DB: /var/lib/africa-media/media.db
      register: media_artwork_refresh
      changed_when: "'updated: 0' not in media_artwork_refresh.stdout"
    - name: Verify new browsing interface is available
      ansible.builtin.uri:
        url: 'http://127.0.0.1:{{ media_port }}/browse.js'
        return_content: true
      register: media_browse_check
      failed_when: media_browse_check.status != 200 or 'categoryChannels' not in media_browse_check.content

    - name: Verify generated thumbnail asset is served with the image MIME type
      ansible.builtin.uri:
        url: 'http://127.0.0.1:{{ media_port }}/assets/thumbnail-fallback.webp'
        method: HEAD
        status_code: 200
      register: media_thumbnail_check
      failed_when: media_thumbnail_check.status != 200 or media_thumbnail_check.content_type != 'image/webp'

    - name: Verify unique name-based channel cover generator
      ansible.builtin.uri:
        url: 'http://127.0.0.1:{{ media_port }}/channel-cover.js'
        return_content: true
      register: media_unique_cover_check
      failed_when: media_unique_cover_check.status != 200 or 'ChannelCovers' not in media_unique_cover_check.content
