---
- name: Publish completed device packages
  hosts: all
  become: true
  vars:
    media_package_dir: ''
    media_package_names:
      - africa-media-android-debug.apk
      - africa-media-windows.exe
      - africa-media-macos.dmg
      - africa-media-linux.AppImage
      - africa-media-samsung.wgt
      - africa-media-lg.ipk
      - africa-media-roku.zip
  tasks:
    - name: Require a target-server directory containing approved build outputs
      ansible.builtin.assert:
        that:
          - media_package_dir is match('^/')
    - name: Create downloads directory
      ansible.builtin.file:
        path: /var/lib/africa-media/downloads
        state: directory
        owner: africa-media
        group: africa-media
        mode: '0755'
    - name: Check each supplied build artifact
      ansible.builtin.stat:
        path: '{{ media_package_dir }}/{{ item }}'
        checksum_algorithm: sha256
      loop: '{{ media_package_names }}'
      register: media_packages
    - name: Publish nonempty packages
      ansible.builtin.copy:
        src: '{{ item.stat.path }}'
        dest: '/var/lib/africa-media/downloads/{{ item.item }}'
        remote_src: true
        owner: africa-media
        group: africa-media
        mode: '0644'
      loop: '{{ media_packages.results }}'
      when: item.stat.exists and item.stat.isreg | default(false) and item.stat.size | default(0) > 0
    - name: Report package checksums
      ansible.builtin.debug:
        msg: '{{ item.item }} SHA256={{ item.stat.checksum }}'
      loop: '{{ media_packages.results }}'
      when: item.stat.exists and item.stat.isreg | default(false) and item.stat.size | default(0) > 0
