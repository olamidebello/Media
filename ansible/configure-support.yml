---
- name: Install private AI support credentials
  hosts: all
  become: true
  tasks:
    - name: Create private configuration directory
      ansible.builtin.file:
        path: /etc/africa-media
        state: directory
        owner: root
        group: root
        mode: '0700'
    - name: Copy private support environment from controller
      ansible.builtin.copy:
        src: '{{ media_support_env_file | default(playbook_dir + "/../.env.local") }}'
        dest: /etc/africa-media/support.env
        owner: root
        group: root
        mode: '0600'
      no_log: true
      notify: Restart media
  handlers:
    - name: Restart media
      ansible.builtin.systemd:
        name: africa-media
        state: restarted
