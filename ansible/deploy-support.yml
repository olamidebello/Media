---
- name: Update platform and deploy Help and support
  ansible.builtin.import_playbook: update-and-deploy.yml
  vars:
    media_refresh_channels: false
    media_prune_channels: false

- name: Verify user guide and private support readiness
  hosts: all
  become: true
  tasks:
    - name: Check guide API through the application service
      ansible.builtin.uri:
        url: http://127.0.0.1:18841/api/support/guide
        return_content: true
      register: media_support_check
      until: media_support_check.status == 200
      retries: 6
      delay: 3
      failed_when: media_support_check.status != 200 or media_support_check.json.topics | default([]) | length == 0
    - name: Report support deployment
      ansible.builtin.debug:
        msg:
          - 'User guide, troubleshooting and support tickets deployed: https://media.africandroid.world/'
          - 'AI support configured: {{ media_support_check.json.ai_available | default(false) | bool }}'
          - 'AI requires the private server environment file /etc/africa-media/support.env. Secrets are never fetched from Git.'
