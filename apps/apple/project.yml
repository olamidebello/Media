name: AfricaMediaHub
options:
  bundleIdPrefix: com.africamedia
targets:
  AfricaMediaHub:
    type: application
    platform: iOS
    deploymentTarget: '16.0'
    sources: [Mobile.swift]
    info:
      path: Info-iOS.plist
      properties:
        NSLocalNetworkUsageDescription: Find TVs on your Wi-Fi to show matching installation options. Device names stay on your phone.
        NSBonjourServices:
          - _googlecast._tcp
          - _androidtvremote2._tcp
          - _adb-tls-connect._tcp
          - _airplay._tcp
          - _webostv._tcp
          - _roku-ecp._tcp
          - _rtsp._tcp
          - _onvif._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.africamedia.hub.ios
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
  AfricaMediaTV:
    type: application
    platform: tvOS
    deploymentTarget: '16.0'
    sources: [TV.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.africamedia.hub.tv
        GENERATE_INFOPLIST_FILE: YES
